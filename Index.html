<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#B8172E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F2F1;--panel:#fff;--panel2:#FAF8F7;--ink:#17151A;--muted:#6E6872;--line:#E7E2E1;--brand:#D7263D;--brand2:#9E1026;--brand-soft:#FCE8EB;
  --good:#1E7F4E;--good-soft:#DDF2E6;--warn:#A35C00;--warn-soft:#FFF0D6;--bad:#B4232F;--bad-soft:#FCE1E3;--wa:#1FAF54;
  --sh:0 1px 2px rgba(23,21,26,.04),0 6px 20px rgba(23,21,26,.06);--r:16px;--font:"IBM Plex Sans","IBM Plex Sans Arabic",Arial,sans-serif;--head:"Archivo","IBM Plex Sans Arabic",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121014;--panel:#1C1A1F;--panel2:#232027;--ink:#F2EFF1;--muted:#A59EA8;--line:#332E37;--brand:#F04A5E;--brand2:#B5192F;--brand-soft:#3A1820;
  --good:#5CC98F;--good-soft:#163024;--warn:#F2B04D;--warn-soft:#3A2A10;--bad:#FF7A85;--bad-soft:#3D1A1E;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme=dark]{--bg:#121014;--panel:#1C1A1F;--panel2:#232027;--ink:#F2EFF1;--muted:#A59EA8;--line:#332E37;--brand:#F04A5E;--brand2:#B5192F;--brand-soft:#3A1820;
  --good:#5CC98F;--good-soft:#163024;--warn:#F2B04D;--warn-soft:#3A2A10;--bad:#FF7A85;--bad-soft:#3D1A1E;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--font);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.bare{padding-bottom:0}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
/* ---------- barre du haut ---------- */
header{position:sticky;top:0;z-index:6;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header .logo{font:800 19px var(--head);letter-spacing:.08em}
header .hr{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
header .hb{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:12px;padding:0;display:inline-flex;align-items:center;justify-content:center;position:relative}
header .hb b{position:absolute;top:-4px;inset-inline-end:-4px;background:#fff;color:var(--brand);border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
header .hav{padding:0;border:2px solid rgba(255,255,255,.5);border-radius:999px;background:none;line-height:0}
#who{display:none}
/* ---------- barre du bas ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.tabbar button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 2px;border-radius:12px;min-width:0;position:relative}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button.on{color:var(--brand)}
.tabbar button.fab{flex:none;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;margin:-22px 6px 4px;box-shadow:0 8px 20px rgba(215,38,61,.35);justify-content:center}
.tabbar button.fab .ic{width:28px;height:28px}
.tabbar .tb{position:absolute;top:2px;inset-inline-end:calc(50% - 20px);background:var(--brand);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
/* ---------- contenu ---------- */
main{max-width:760px;margin:0 auto;padding:16px;display:grid;gap:16px}
body.admin main{max-width:1100px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em} h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
.pt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0;box-shadow:var(--sh)}
.sec{display:grid;gap:10px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sech h2{display:flex;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:4px 0;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.kpi .v{font:700 22px var(--head);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.hero{border-color:var(--brand);box-shadow:inset 0 3px 0 var(--brand),var(--sh)}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:90px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.full{grid-column:1/-1}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
button.big{width:100%;padding:15px;font-size:16px;border-radius:14px}
button.sm{padding:6px 10px;font-size:13px;border-radius:10px}
button.ghost{background:transparent}
button:disabled{opacity:.55}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:end}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.sub td{font-weight:600;background:var(--panel2)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--good-soft);color:var(--good)}.wait{background:var(--warn-soft);color:var(--warn)}.no{background:var(--bad-soft);color:var(--bad)}
.neg{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:12px}
.err{background:var(--bad-soft);color:var(--bad);padding:11px 13px;border-radius:12px;font-weight:500}
.note{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.success{text-align:center;display:grid;gap:12px;justify-items:center}
.success .okc{width:72px;height:72px;border-radius:999px;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center}
.success .okc .ic{width:38px;height:38px}
.resume{white-space:pre-wrap;text-align:start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;width:100%}
a.wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:14px;font-size:16px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;background:var(--panel)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:7px 12px;font-size:13px;border-radius:999px;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.wrap{flex-wrap:wrap;overflow:visible}.chips.wrap button{padding:10px 14px;font-size:14px}
.chart{display:grid;gap:4px}
.cbars{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line)}
.cbars button{flex:1;min-width:0;padding:0;border:0;border-radius:3px 3px 0 0;background:var(--brand);min-height:2px;opacity:.85}
.cbars button.negb{background:var(--bad);opacity:.5}.cbars button.sel{opacity:1;outline:2px solid var(--ink)}.cbars button.zero{background:var(--line)}
.xl{display:flex;gap:2px;font-size:10px;color:var(--muted)}.xl span{flex:1;min-width:0;text-align:center;overflow:hidden}
.cap{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:13px}
.nitem{border-inline-start:4px solid var(--line)}.nitem.new{border-inline-start-color:var(--brand)}.nitem .t{font-weight:700}
.li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.li span{color:var(--ink)}.li small{display:block;color:var(--muted);font-size:12px}
.li b{font-variant-numeric:tabular-nums;white-space:nowrap}.li.tot{border-top:2px solid var(--ink);border-bottom:0;padding-top:12px}.li.tot span{font-weight:700}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.big3{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.big3 .kpi .v{font-size:19px}.kpi.in{box-shadow:inset 0 3px 0 var(--good),var(--sh)}.kpi.out{box-shadow:inset 0 3px 0 var(--bad),var(--sh)}
@media (max-width:420px){.big3{grid-template-columns:1fr 1fr}.big3 .kpi.hero{grid-column:1/-1}}
.oc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:5px;background:var(--panel)}
.oc .top{display:flex;justify-content:space-between;gap:8px;align-items:center}.oc .top b{font-size:15px}
.oc .meta{font-size:12.5px;color:var(--muted)}.oc .nums{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.oc .nums span b{font-variant-numeric:tabular-nums}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:600}
tr.click{cursor:pointer}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.act a,.act button{font-size:13px;font-weight:600;text-decoration:none;padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--ink);background:var(--panel);display:inline-flex;align-items:center;gap:6px}
.act a.wa,.act button.wa{display:inline-flex;width:auto;background:var(--wa);color:#fff;border-color:var(--wa);padding:8px 12px;font-size:13px}
.relance{font-size:13px;font-weight:600;color:var(--bad)}
details.msg{border-top:1px dashed var(--line);padding-top:8px}details.msg summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--brand)}
details.msg .resume{margin:8px 0;font-size:14px;line-height:1.7}
.opts{display:grid;gap:8px;margin:8px 0}.opt{white-space:pre-wrap;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:14px;line-height:1.7;cursor:pointer;background:var(--panel2)}
.opt.on{border-color:var(--wa);box-shadow:inset 0 0 0 1px var(--wa)}
.hbar{display:grid;gap:3px}.hbar .hl{display:flex;justify-content:space-between;gap:8px;font-size:13px}.hbar .hl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .ht{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.hbar .ht div{height:100%;background:var(--brand);border-radius:4px}
#dtc{display:grid;gap:14px}
.prev img{max-width:160px;border-radius:10px;border:1px solid var(--line)}
/* ---------- pop-up ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,8,12,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal .sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom));position:relative;display:grid;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:600px){.modal{align-items:center}.modal .sheet{border-radius:22px}}
.modal .x{position:absolute;top:12px;inset-inline-end:12px;border:0;background:var(--panel2);border-radius:999px;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center}
#mbody{display:grid;gap:12px}.wstep{display:grid;gap:10px}.wstep h2{font-size:20px;padding-inline-end:36px}
.wprog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}.wprog div{height:100%;background:var(--brand)}
.wnav{display:flex;justify-content:space-between;gap:10px}.wnav button{flex:1;padding:14px;font-size:16px;border-radius:14px}
.sug{display:grid;gap:6px}.sug button{display:flex;justify-content:space-between;gap:8px;text-align:start}.sug button span{color:var(--muted);font-size:12px;font-weight:400}
.tagok{background:var(--good-soft);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sugg:empty{display:none}.sugg button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600}
.tlist{display:grid;gap:8px}.tcard{display:grid;gap:2px;text-align:start;padding:11px 13px;border-radius:12px}
.tcard span{font-weight:400;font-size:12.5px;color:var(--muted)}.tcard.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.hist summary{color:var(--ink)!important;font-weight:600}.hist .card{margin-top:8px}
.ofp{font:800 17px var(--head);color:var(--brand)}
/* ---------- accueil ---------- */
.welcome{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 26px rgba(158,16,38,.25)}
.welcome .hi{font:700 20px var(--head)}.welcome .hm{font-size:13px;opacity:.9;margin-top:3px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#fff;color:var(--brand);font-weight:800;overflow:hidden;vertical-align:middle;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.avbtn{position:relative;padding:0;border:0;background:none;border-radius:999px;flex:none}
.avbtn i{position:absolute;inset-inline-end:-2px;bottom:-2px;background:#fff;color:var(--brand);border-radius:999px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.avbtn i .ic{width:14px;height:14px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:16px;font-size:12px;font-weight:600;background:var(--panel);box-shadow:var(--sh);text-align:center;line-height:1.25}
.qa button i{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center}
.qa button.main i{background:var(--brand);color:#fff}
.comc .big{font:800 30px var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.comc .c2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comc .c2>div{background:var(--panel2);border-radius:12px;padding:10px 12px}
.comc .l{font-size:12px;color:var(--muted)}.comc .v{font:700 18px var(--head);font-variant-numeric:tabular-nums}.comc .v.good{color:var(--good)}.comc .v.warn{color:var(--warn)}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.prog div{height:100%;background:var(--good);border-radius:4px}
.pays{display:flex;gap:6px;flex-wrap:wrap}.pays a{color:inherit;text-decoration:none;margin-inline-start:4px}
.mpill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
.mpill input{border:0;background:none;padding:4px;width:auto;font-size:13px;box-shadow:none}
.rl{display:grid;gap:8px}.rr{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--panel)}
.rr input{width:22px;height:22px;flex:none;accent-color:var(--brand)}.rr .rt{flex:1;min-width:0;display:grid;cursor:pointer}.rr .rt span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.wa{background:var(--wa);border-color:var(--wa);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font:700 17px var(--head)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:9px;height:9px;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px}
details.fold[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
/* ---------- compte ---------- */
.acc{display:grid;justify-items:center;gap:8px;text-align:center;padding:8px 0 4px}
.acc .an{font:800 22px var(--head)}
.mlist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.mlist>button,.mlist>div{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:start;font-weight:500}
.mlist>:last-child{border-bottom:0}
.mlist .mi{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.mlist .mt{flex:1;min-width:0}.mlist .mt small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.mlist .chev{color:var(--muted)}
.mlist .danger{color:var(--bad)}.mlist .danger .mi{background:var(--bad-soft);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);text-align:start}
.tile small{font-weight:400;line-height:1.35;display:block;margin-top:2px}
.tile i{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
/* ---------- entrée (langue, connexion) ---------- */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.gtop{background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;padding:calc(48px + env(safe-area-inset-top)) 24px 70px;text-align:center;position:relative;overflow:hidden}
.gtop:before,.gtop:after{content:"";position:absolute;border-radius:999px;background:rgba(255,255,255,.07)}
.gtop:before{width:260px;height:260px;top:-90px;inset-inline-end:-70px}.gtop:after{width:180px;height:180px;bottom:-80px;inset-inline-start:-50px}
.mark{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font:800 34px "Archivo",Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.wordmark{font:800 30px "Archivo",Arial,sans-serif;letter-spacing:.14em}
.slogan{margin-top:8px;font-size:15px;opacity:.92;line-height:1.5;max-width:340px;margin-inline:auto}
.gbody{flex:1;margin-top:-40px;position:relative;z-index:1;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.gcard{background:var(--panel);border-radius:24px;padding:24px 20px;box-shadow:0 12px 40px rgba(23,21,26,.10);display:grid;gap:14px;max-width:440px;margin:0 auto}
.gcard h1{font-size:24px}

/* ---------- Offre pour un client ---------- */

    '<div class="grp">' + t('1. Choisissez l\'offre') + '</div><div class="opts" id="of-o">' + O.map(function (o, i) { return '<div class="opt' + (i ? '' : ' on') + '" dir="rtl" data-i="' + i + '">' + esc(o.t) + '</div>'; }).join('') + '</div>' +
    '<div class="grp">' + t('2. Ton du message') + '</div>' + chipSel('of-s', [['0', t('Chaleureux')], ['1', t('Convaincant')], ['2', t('Court')]], '0') +
    '<div class="resume" dir="rtl" id="of-msg" contenteditable="true"></div><p class="note">' + t('Vous pouvez modifier le message avant de l\'envoyer.') + '</p>' +
    '<div class="act">' + (c.tel ? '<a class="wa" href="#" id="of-wa">' + ic('send') + t('Envoyer sur WhatsApp') + '</a><a href="tel:' + esc(c.tel) + '" id="of-call">' + ic('phone') + t('Appeler') + '</a>' : '') + '<a href="#" id="of-done">' + ic('check') + t('Relance faite') + '</a></div>');
  $('of-o').querySelectorAll('.opt').forEach(function (x) { x.onclick = function () { $('of-o').querySelectorAll('.opt').forEach(function (y) { y.classList.toggle('on', y === x); }); st.o = +x.dataset.i; draw(); }; });
  bindSel('of-s', false, function (v) { st.s = +v; draw(); });

  if ($('of-wa')) $('of-wa').onclick = function (e) { e.preventDefault(); window.open(waUrl(c.tel, $('of-msg').textContent), '_blank'); mark('wa'); };

/* ---------- Envoi groupé (un client après l'autre) ---------- */
function bulkSend(L) {
  if (!L.length) return;
  var Q = L.map(function (c) { return { c: c, O: offresFor(c), o: 0, done: false }; }), i = 0, style = 0;
  var draw = function () {
    var q = Q[i], c = q.c, sent = Q.filter(function (x) { return x.done; }).length;
    modal('<div class="wprog"><div style="width:' + Math.round(sent / Q.length * 100) + '%"></div></div><div class="note">' + t('{a} / {b} envoyés', { a: sent, b: Q.length }) + '</div>' +
      '<h2>' + (i + 1) + '. ' + esc(c.nom) + '</h2><div class="note">' + esc(c.tel) + ' · ' + t('{n} cmd', { n: c.n }) + '</div>' +
      '<label>' + t('Offre') + '<select id="b-o">' + q.O.map(function (o, k) { return '<option value="' + k + '"' + (k === q.o ? ' selected' : '') + '>' + esc(o.t.slice(0, 70)) + '</option>'; }).join('') + '</select></label>' +
      '<div class="resume" dir="rtl" id="b-msg" contenteditable="true">' + esc(msgFor(c, q.O[q.o].t, style)) + '</div>' +
      '<a class="wa" href="#" id="b-send">' + ic('send') + t('Envoyer à {nom}', { nom: c.nom.split(/[\/(]/)[0] }) + (q.done ? ' ✓' : '') + '</a>' +
      '<div class="wnav"><button type="button" id="b-prev"' + (i ? '' : ' disabled') + '>' + t('Précédent') + '</button><button type="button" id="b-skip">' + (i < Q.length - 1 ? t('Suivant') : t('Terminer')) + '</button></div>' +
      '<p class="note">' + t('WhatsApp s\'ouvre avec le message prêt : appuyez sur « Envoyer », puis revenez dans l\'application pour passer au client suivant.') + '</p>');
    $('b-o').onchange = function () { q.o = +this.value; $('b-msg').textContent = msgFor(c, q.O[q.o].t, style); };
    $('b-send').onclick = function (e) {
      e.preventDefault(); window.open(waUrl(c.tel, $('b-msg').textContent), '_blank');
      q.done = true; call('markRelance', S.token, c.cle, c.nom, c.tel, 'wa').catch(function () {});
      S.clientsP = null;
      if (i < Q.length - 1) i++;
      setTimeout(draw, 400);
    };
    $('b-prev').onclick = function () { if (i) { i--; draw(); } };
    $('b-skip').onclick = function () { if (i < Q.length - 1) { i++; draw(); } else { closeModal(); if (S.view === 'home') vHome(); else go(S.view); } };
  };
  draw();
}

S.dm = 'ca'; S.ds = ''; S.mm = 'ca'; S.msal = '';
function DMf() { return S.role === 'admin' ? [['ca', t('CA')], ['cmd', t('Commandes')], ['enc', t('Encaissé')], ['ads', 'Ads'], ['marge', t('Marge')]] : [['cmd', t('Commandes')], ['com', t('Commission')]]; }
function MMf() { return [['ca', t('CA')], ['net', 'NET'], ['cmd', t('Commandes')], ['ads', 'Ads Timedia'], ['com', t('Commissions')]]; }
function sumDay(day, who) {
  var s = [0, 0, 0, 0, 0];
  Object.keys(day.s).forEach(function (n) { if (who && n !== who) return; for (var i = 0; i < 5; i++) s[i] += day.s[n][i]; });
  return { ca: s[0], cmd: s[1], ads: s[2], enc: s[3], com: s[4], marge: s[0] - s[4] - s[2] };
}
function salerNames(days) {

  return Object.keys(o).filter(function (n) { return o[n] > 0; }).sort(function (a, b) { return o[b] - o[a]; });

  }).join('') + '</div><div class="xl">' + labels.map(function (l, i) { return '<span>' + (i % every === 0 ? esc(l) : '') + '</span>'; }).join('') + '</div></div>';

function drawDaily(days) {

    var tot = vals.reduce(function (s, v) { return s + v; }, 0), bi = 0;

    $('dcap').textContent = t('Total') + ' ' + fmtK(k, tot) + ' · ' + t('Moyenne/jour') + ' ' + fmtK(k, tot / upto) + (vals[bi] > 0 ? ' · ' + t('Meilleur jour : le {d} ({v})', { d: days[bi].d.slice(8), v: fmtK(k, vals[bi]) }) : '');
    bindBars($('dc'), function (i) {

      $('dcap').innerHTML = '<b>' + d.slice(8) + '/' + d.slice(5, 7) + (who ? ' · ' + esc(who) : '') + '</b> — ' + (S.role === 'admin' ? t('CA') + ' ' + dh(r.ca) + ' · ' : '') + t('{n} cmd', { n: r.cmd }) + ' · ' + (S.role === 'admin'
        ? t('Encaissé') + ' ' + dh(r.enc) + ' · Ads ' + dh(r.ads) + ' · ' + t('Marge') + ' <span class="' + (r.marge < 0 ? 'neg' : '') + '">' + dh(r.marge) + '</span>'
        : t('Commission') + ' ' + dh(r.com));

  };
