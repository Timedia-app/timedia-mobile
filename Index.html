<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#D7263D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F6F5F4;--panel:#fff;--ink:#1C1A1F;--muted:#6C6670;--line:#E4E0E2;--brand:#D7263D;--good:#1E7F4E;--good-soft:#DDF2E6;
  --warn:#A35C00;--warn-soft:#FFF0D6;--bad:#B4232F;--bad-soft:#FCE1E3;--wa:#1FAF54}
@media (prefers-color-scheme:dark){:root{--bg:#151316;--panel:#1F1C21;--ink:#F1EEF0;--muted:#A39CA6;--line:#36313A;--brand:#F04A5E;
  --good:#5CC98F;--good-soft:#163024;--warn:#F2B04D;--warn-soft:#3A2A10;--bad:#FF7A85;--bad-soft:#3D1A1E;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",Arial,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header .logo{font:800 19px "Archivo",Arial,sans-serif;letter-spacing:.02em}
header .who{margin-left:auto;font-size:13px;opacity:.9}
header button{background:rgba(255,255,255,.18);color:#fff;border:0}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:4}
nav button{background:transparent;border:0;color:var(--muted);font-weight:600;padding:8px 10px;border-radius:8px;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:14px 16px;display:grid;gap:14px}
h1,h2{font-family:"Archivo",Arial,sans-serif;margin:0} h1{font-size:21px} h2{font-size:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font:700 22px "Archivo",Arial,sans-serif;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.hero{border-color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}
textarea{min-height:90px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.full{grid-column:1/-1}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
button.big{width:100%;padding:14px;font-size:16px}
button.sm{padding:5px 9px;font-size:13px}
button:disabled{opacity:.55}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.sub td{font-weight:600;background:var(--bg)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.ok{background:var(--good-soft);color:var(--good)}.wait{background:var(--warn-soft);color:var(--warn)}.no{background:var(--bad-soft);color:var(--bad)}
.neg{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:12px}
.err{background:var(--bad-soft);color:var(--bad);padding:10px;border-radius:10px}
.note{font-size:12px;color:var(--muted)}
.success{text-align:center;display:grid;gap:12px;justify-items:center}
.success .big-emoji{font-size:54px}
.resume{white-space:pre-wrap;text-align:left;background:var(--bg);border-radius:10px;padding:12px;font-size:14px;width:100%}
a.wa{display:block;width:100%;text-align:center;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:12px;font-size:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--panel)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:80px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{padding:6px 11px;font-size:13px;border-radius:999px;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{display:grid;gap:4px}
.cbars{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line)}
.cbars button{flex:1;min-width:0;padding:0;border:0;border-radius:3px 3px 0 0;background:var(--brand);min-height:2px;opacity:.85}
.cbars button.negb{background:var(--bad);opacity:.5}
.cbars button.sel{opacity:1;outline:2px solid var(--ink)}
.cbars button.zero{background:var(--line)}
.xl{display:flex;gap:2px;font-size:10px;color:var(--muted)}.xl span{flex:1;min-width:0;text-align:center;overflow:hidden}
.ymax{font-size:11px;color:var(--muted)}
.cap{background:var(--bg);border-radius:10px;padding:9px 11px;font-size:13px}
.bell{position:relative}
.bell b{position:absolute;top:-6px;right:-6px;background:#fff;color:var(--brand);border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.nitem{border-left:4px solid var(--line)}.nitem.new{border-left-color:var(--brand)}
.nitem .t{font-weight:700}
ol.steps{margin:0;padding-left:20px;display:grid;gap:8px}
.li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.li span{color:var(--ink)}.li small{display:block;color:var(--muted);font-size:12px}
.li b{font-variant-numeric:tabular-nums;white-space:nowrap}.li.tot{border-top:2px solid var(--ink);border-bottom:0;padding-top:11px}.li.tot span{font-weight:700}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.big3{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.big3 .kpi .v{font-size:19px}.kpi.in{box-shadow:inset 0 3px 0 var(--good)}.kpi.out{box-shadow:inset 0 3px 0 var(--bad)}
@media (max-width:420px){.big3{grid-template-columns:1fr 1fr}.big3 .kpi.hero{grid-column:1/-1}}
.oc{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:grid;gap:4px;background:var(--panel)}
.oc .top{display:flex;justify-content:space-between;gap:8px;align-items:center}.oc .top b{font-size:15px}
.oc .meta{font-size:12px;color:var(--muted)}.oc .nums{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.oc .nums span b{font-variant-numeric:tabular-nums}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:600}
tr.click{cursor:pointer}
.oc .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.oc .act a{font-size:13px;font-weight:600;text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink)}
.oc .act a.wa{display:inline-block;width:auto;background:var(--wa);color:#fff;border-color:var(--wa);padding:6px 10px;font-size:13px}
.relance{font-size:13px;font-weight:600;color:var(--bad)}
details.msg{border-top:1px dashed var(--line);padding-top:6px}details.msg summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--wa)}
details.msg .resume{margin:8px 0;font-size:14px;line-height:1.7}
.opts{display:grid;gap:8px;margin:8px 0}.opt{white-space:pre-wrap;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:14px;line-height:1.7;cursor:pointer;background:var(--bg)}
.opt.on{border-color:var(--wa);box-shadow:inset 0 0 0 1px var(--wa)}
.hb{display:grid;gap:3px}.hb .hl{display:flex;justify-content:space-between;gap:8px;font-size:13px}.hb .hl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .ht{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.hb .ht div{height:100%;background:var(--brand);border-radius:4px}
#dtc{display:grid;gap:14px}
.prev img{max-width:160px;border-radius:8px;border:1px solid var(--line)}
.loading{opacity:.6;pointer-events:none}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 26px;position:relative;display:grid;gap:12px}
@media (min-width:600px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.modal .x{position:absolute;top:10px;right:10px;border:0;background:var(--bg);border-radius:999px;width:34px;height:34px;padding:0}
#mbody{display:grid;gap:12px}.wstep{display:grid;gap:10px}.wstep h2{font-size:20px;padding-right:30px}
.wprog{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.wprog div{height:100%;background:var(--brand)}
.wnav{display:flex;justify-content:space-between;gap:10px}.wnav button{flex:1;padding:14px;font-size:16px}
.chips.wrap{flex-wrap:wrap;overflow:visible}.chips.wrap button{padding:10px 14px;font-size:14px}
.sug{display:grid;gap:6px}.sug button{display:flex;justify-content:space-between;gap:8px;text-align:left}.sug button span{color:var(--muted);font-size:12px;font-weight:400}
.tagok{background:var(--good-soft);color:var(--good);border-radius:10px;padding:9px 11px;font-weight:600;font-size:13px}
.newbtn{font-size:18px;padding:18px;border-radius:14px}
.com .c3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.com .l{font-size:12px;color:var(--muted)}.com .v{font:700 19px "Archivo",Arial,sans-serif;font-variant-numeric:tabular-nums}
.com .v.good{color:var(--good)}.com .v.warn{color:var(--warn)}.pays{display:flex;gap:6px;flex-wrap:wrap}.pays a{color:inherit;text-decoration:none;margin-left:4px}
.rl{display:grid;gap:6px}.rr{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rr input{width:22px;height:22px;flex:none}.rr .rt{flex:1;min-width:0;display:grid;cursor:pointer}.rr .rt span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.act a.wa{display:inline-block;width:auto;padding:8px 12px;font-size:14px}
</style>
</head>
<body>
<header><span class="logo">TIMEDIA</span><span class="who" id="who"></span></header>
<nav id="nav" hidden></nav>
<main id="app"><div class="panel">Kaytcharga…</div></main>

<script>
var S = { token: null, role: null, nom: null, refs: null, view: null, mois: null, data: null };
try { var saved = JSON.parse(localStorage.getItem('timedia_session') || 'null'); if (saved) { S.token = saved.token; S.role = saved.role; S.nom = saved.nom; } } catch (e) {}
S.mois = new Date().toISOString().slice(0, 7);
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n0(v) { return Math.round(v || 0).toLocaleString('fr-FR').replace(/ | /g, ' '); }
function dh(v) { return n0(v) + ' DH'; }
function pct(v) { return isFinite(v) ? Math.round(v * 100) + '%' : '–'; }
function moisLabel(M) { var m = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre']; return m[+M.slice(5, 7) - 1] + ' ' + M.slice(0, 4); }
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
      if (String(e && e.message).indexOf('SESSION') >= 0) { logoutLocal(); rej(new Error('Session sallat, dkhli 3awtani.')); } else rej(e);
    });
    r[fn].apply(r, args);
  });
}
function saveSession() { try { localStorage.setItem('timedia_session', JSON.stringify({ token: S.token, role: S.role, nom: S.nom })); } catch (e) {} }
function logoutLocal() { S.token = null; try { localStorage.removeItem('timedia_session'); } catch (e) {} renderLogin(); }
function show(html) { $('app').innerHTML = html; window.scrollTo(0, 0); }
function errBox(e) { return '<div class="err">' + esc(e && e.message || e) + '</div>'; }

/* ---------------- LOGIN ---------------- */
function renderLogin(msg) {
  $('nav').hidden = true; $('who').textContent = '';
  show('<div class="panel" style="max-width:420px;margin:30px auto"><h1>Dkhol</h1>' + (msg ? errBox(msg) : '') +
    '<label>Nmra dyal WhatsApp<input id="l-tel" inputmode="tel" autocomplete="tel" placeholder="06…"></label>' +
    '<label>Code<input id="l-code" inputmode="numeric" type="password" autocomplete="current-password"></label>' +
    '<button class="pri big" id="l-btn">Dkhol</button><p class="note">Code kay3tih lik Maddah.</p></div>');
  $('l-btn').onclick = function () {
    var b = this; b.disabled = true;
    call('login', $('l-tel').value, $('l-code').value).then(function (r) {
      S.token = r.token; S.role = r.role; S.nom = r.nom; saveSession(); start();
    }).catch(function (e) { b.disabled = false; renderLogin(e.message); });
  };
}

/* ---------------- START ---------------- */
function start() {
  if (!S.token) return renderLogin();
  call('getRefs', S.token).then(function (r) {
    S.refs = r; $('who').innerHTML = esc(S.nom) + ' <button class="sm bell" id="bell" aria-label="Notifications">🔔<b id="badge" hidden></b></button> <button class="sm" id="lo">Khrej</button>';
    $('bell').onclick = function () { go('notifs'); };
    refreshBadge(); clearInterval(S.poll); S.poll = setInterval(refreshBadge, 60000);
    $('lo').onclick = function () { call('logout', S.token).catch(function () {}); logoutLocal(); };
    var tabs = S.role === 'admin'
      ? [['dash', 'Dashboard'], ['verif', 'À vérifier'], ['clients', 'Clients'], ['cmds', 'Commandes'], ['ads', 'Ads'], ['sorties', 'Sorties'], ['annee', 'Année'], ['salers', 'Salers'], ['ai', '✨ AI']]
      : [['home', '🏠 Accueil'], ['clients', 'Clients'], ['ai', '✨ AI']];
    $('nav').hidden = false;
    $('nav').innerHTML = tabs.map(function (t) { return '<button data-v="' + t[0] + '">' + t[1] + '</button>'; }).join('');
    Array.prototype.forEach.call($('nav').children, function (b) { b.onclick = function () { go(b.dataset.v); }; });
    go(tabs[0][0]);
  }).catch(function (e) { renderLogin(e.message); });
}
function go(v) {
  closeModal();
  if (v === 'new') return openNew();
  S.view = v;
  Array.prototype.forEach.call($('nav').children, function (b) { b.classList.toggle('on', b.dataset.v === v); });
  ({ ai: vAI, clients: vClients, notifs: vNotifs, home: vHome, new: vNew, reste: vReste, dash: vDash, verif: vVerif, cmds: vCmds, ads: vAds, sorties: vSorties, annee: vAnnee, salers: vSalers })[v]();
}
function moisPicker() { return '<label style="max-width:200px">Chhar<input type="month" id="mois" value="' + S.mois + '"></label>'; }
function bindMois(fn) { var m = $('mois'); if (m) m.onchange = function () { if (m.value) { S.mois = m.value; fn(); } }; }

/* ---------------- PHOTO ---------------- */
function readPhoto(file) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1400, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { rej(new Error('Tswira ma t9rach')); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function recuBlock(prefix) {
  return '<div class="full panel" style="padding:10px"><b>Reçu dyal lflous</b>' +
    '<div class="seg"><button type="button" class="on" data-recu="photo">📷 Tswira</button><button type="button" data-recu="msg">✍️ Message</button></div>' +
    '<div id="' + prefix + '-photo-box"><input type="file" accept="image/*" id="' + prefix + '-photo"><div class="prev" id="' + prefix + '-prev"></div></div>' +
    '<div id="' + prefix + '-msg-box" hidden><textarea id="' + prefix + '-msg" placeholder="ex: Virement CIH 500 DH mn smiya …"></textarea></div></div>';
}
function bindRecu(prefix, state) {
  document.querySelectorAll('[data-recu]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-recu]').forEach(function (x) { x.classList.toggle('on', x === b); });
      state.mode = b.dataset.recu;
      $(prefix + '-photo-box').hidden = state.mode !== 'photo'; $(prefix + '-msg-box').hidden = state.mode !== 'msg';
    };
  });
  $(prefix + '-photo').onchange = function () {
    var f = this.files[0]; if (!f) return;
    readPhoto(f).then(function (d) { state.photo = d; $(prefix + '-prev').innerHTML = '<img src="' + d + '" alt="reçu">'; })
      .catch(function (e) { alert(e.message); });
  };
}
function successScreen(title, resume, again) {
  var wa = 'https://wa.me/' + S.refs.whatsapp + '?text=' + encodeURIComponent(resume);
  show('<div class="panel success"><div class="big-emoji">🎉</div><h1>' + esc(title) + '</h1>' +
    '<p class="muted">Tsjlat f platform w f sheet dyalek.</p><div class="resume">' + esc(resume) + '</div>' +
    '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">Sifti résumé l responsable f WhatsApp</a>' +
    '<div class="row"><button id="again">' + esc(again) + '</button><button id="tohome">Commandes dyali</button></div></div>');
  $('again').onclick = function () { go(S.view); };
  $('tohome').onclick = function () { go('home'); };
}

/* ---------------- SALER: NOUVELLE COMMANDE ---------------- */
function opt(list, blank) { return (blank ? '<option value="">' + blank + '</option>' : '') + list.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join(''); }
function vNew() {
  var sv = S.refs.services.map(function (s) { return s.nom; });
  var st = { mode: 'photo', photo: null };
  show('<h1>Commande jdida</h1><form class="panel form" id="f">' +
    '<label class="full">Nom de projet / client<input name="client" required placeholder="ex: doudrar"></label>' +
    '<label>Tel du client<input name="tel" inputmode="tel"></label>' +
    '<label>Date<input name="date" type="date" value="' + new Date().toISOString().slice(0, 10) + '"></label>' +
    '<label class="full">Service<select name="service" id="svc" required>' + opt(sv, '— Khtari service —') + '</select></label>' +
    '<label>Jours ads<input name="jours" type="number" min="0" inputmode="numeric"></label>' +
    '<label>Budget client ($/jour)<input name="budgetUsd" type="number" min="0" step="0.5" inputmode="decimal" placeholder="5"></label>' +
    '<label>Lancé par<select name="lancePar">' + opt(['Media buyer', 'Maddah']) + '</select></label>' +
    '<label>Prix de vente<input name="prix" id="prix" type="number" min="0" inputmode="numeric" required></label>' +
    '<label>Avance<input name="avance" type="number" min="0" inputmode="numeric" required></label>' +
    '<label>Banque<select name="banque">' + opt(S.refs.banques) + '</select></label>' +
    '<label id="cm-box" hidden>Commission (sur mesure)<input name="commissionManuelle" type="number" min="0"></label>' +
    '<label>Format<input name="format" value="Facebook et Instagram"></label>' +
    '<label>Voix<select name="voix">' + opt(['bnt', 'wld', 'bla voix']) + '</select></label>' +
    '<label>Langage<select name="langage">' + opt(['darija', 'français', 'arabe']) + '</select></label>' +
    '<label class="full">Note<textarea name="note" style="min-height:60px"></textarea></label>' +
    recuBlock('c') + '<div class="full" id="ferr"></div>' +
    '<button class="pri big full" type="submit" id="send">Enregistrer la commande</button></form>');
  bindRecu('c', st);
  $('svc').onchange = function () {
    var s = S.refs.services.filter(function (x) { return x.nom === $('svc').value; })[0];
    if (s && s.prix != null && !$('prix').value) $('prix').value = s.prix;
    $('cm-box').hidden = !(s && s.famille === 'AUTRE');
  };

  wizSave(k);
  var e = wizCheck(k); if (e) return wizRender(e);
  if (k !== 'ok') { var st = wizSteps(W); W.k = st[st.indexOf(k) + 1]; return wizRender(); }
  var btn = $('w-next'); btn.disabled = true; btn.textContent = 'Kaytsjel…';
  var rec = W.recu === 'photo' ? { photo: W.photo } : { recuMessage: W.recuMessage };
  var p = W.pay === 'Reste'
    ? call('submitReste', S.token, Object.assign({ commandeId: W.resteId, montant: W.montant, banque: W.banque }, rec))
    : call('submitCommande2', S.token, Object.assign({ client: W.client, tel: W.tel, ancien: !!W.ancien, items: W.items, jours: W.items.indexOf('Ads') >= 0 ? W.jours : 0,
        budgetUsd: W.budgetUsd, lancePar: W.lancePar, autre: W.autre, commissionManuelle: W.commissionManuelle, pageFb: W.pageFb, pageIg: W.pageIg,
        format: hasVideo(W) ? W.format : '', voix: hasVideo(W) ? W.voix : '', langage: hasVideo(W) ? W.langage : '', prix: W.prix, avance: W.avance,
        payType: W.pay, banque: W.banque }, rec));
  p.then(function (r) {
    S.restes = null; S.clientsP = null;
    var wa = 'https://wa.me/' + S.refs.whatsapp + '?text=' + encodeURIComponent(r.resume);
    modal('<div class="success"><div class="big-emoji">🎉</div><h1>Bravo 3lik!</h1>' +
      '<p>' + (W.pay === 'Reste' ? 'Reste tsjel.' : 'Commande tsjlat.') + ' Daba sifti l résumé l responsable. <b>Mli ytverifya, ghadi tban f lista dyalek.</b></p>' +
      '<div class="resume">' + esc(r.resume) + '</div>' +
      '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">📲 Sifti l responsable f WhatsApp</a>' +
      '<div class="row"><button type="button" id="w-again">+ Commande khra</button><button type="button" id="w-home">Rje3 l accueil</button></div></div>');
    $('w-again').onclick = openNew;
    $('w-home').onclick = function () { closeModal(); go('home'); };
  }).catch(function (err) { btn.disabled = false; btn.textContent = 'Sifti l responsable'; wizRender(err); });
}

        '<div><div class="l">Tkhelsat</div><div class="v good">' + dh(d.commissionPayee) + '</div></div>' +
        '<div><div class="l">Ba9i lik</div><div class="v ' + (ba9i ? 'warn' : '') + '">' + dh(ba9i) + '</div></div></div>' +
        (d.commission > base ? '<div class="note">+ ' + dh(d.commission - base) + ' katsna vérification</div>' : '') +
        (d.paiements.length ? '<div class="pays">' + d.paiements.map(function (p) { return '<span class="pill ok">' + fd(p.date) + ' · ' + n0(p.montant) + ' DH <a href="#" data-del="' + esc(p.date + '|' + p.montant) + '" title="Mse7">✕</a></span>'; }).join(' ') + '</div>' : '') +
        '<button id="h-pay">💸 Sjjli khlass dyal commission</button></div>' +
      '<div class="kpis"><div class="kpi"><div class="l">Commandes dyal chhar</div><div class="v">' + verifs.length + '</div><div class="l">' + (d.nAttente ? d.nAttente + ' katsna vérification' : 'Kolhom vérifiées') + '</div></div></div>' +
      '<div class="panel"><div class="row" style="justify-content:space-between"><h2>⏰ Khasshom Relance</h2><button class="sm" id="h-all">Kolhom ›</button></div><div id="h-rel"><p class="note">Kaytcharga…</p></div></div>' +
      '<div class="panel"><h2>Commandes dyali (' + verifs.length + ')</h2>' +
      (verifs.length ? verifs.map(orderCard).join('') : '<p class="muted">7ta commande vérifiée had chhar.</p>') + '</div>' +
      dailyPanel(null) +
      '<div class="panel"><h2>Kol chhar</h2><div class="tbox"><table><thead><tr><th>Chhar</th><th class="n">Cmd</th><th class="n">CA</th><th class="n">Commission</th></tr></thead><tbody>' +
      d.months.map(function (m) { return '<tr class="click" data-m="' + m.mois + '"><td>' + esc(moisLabel(m.mois)) + '</td><td class="n">' + m.n + '</td><td class="n">' + n0(m.ca) + '</td><td class="n"><b>' + n0(m.com) + '</b></td></tr>'; }).join('') +
      '</tbody></table></div></div>');
    drawDaily(d.days);
    $('h-new').onclick = openNew;
    $('h-all').onclick = function () { S.cf = 'relance'; go('clients'); };
    $('h-pay').onclick = function () { payModal(d.mois, ba9i); };
    document.querySelectorAll('[data-del]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); var x = a.dataset.del.split('|');
      if (confirm('Nmse7 had khlass (' + x[1] + ' DH)?')) call('delComPaiement', S.token, x[0], +x[1], d.mois).then(vHome).catch(function (er) { alert(er.message); }); }; });
    document.querySelectorAll('tr[data-m]').forEach(function (tr) { tr.onclick = function () { S.mois = tr.dataset.m; vHome(); }; });
    bindMois(vHome);
    loadClients().then(function (all) {
      if (!$('h-rel')) return;
      var rel = all.filter(needRelance).sort(function (a, b) { var x = a.statut === 'relance' ? 0 : 1, y = b.statut === 'relance' ? 0 : 1; return x - y || (x ? b.total - a.total : a.retard - b.retard); });
      S.relList = rel;
      $('h-rel').innerHTML = rel.length ? '<div class="note">' + rel.length + ' clients — cochi w sifti l kolhom dqa wa7da, wla cliqui 3la wa7d.</div>' +
        '<div class="rl">' + rel.slice(0, 8).map(function (c, i) { return relRow(c, i); }).join('') + '</div>' +
        '<button class="wa big" id="h-bulk" disabled>📲 Sifti l offres l (0) clients</button>' : '<p class="muted">Walou daba 👏</p>';
      bindRel($('h-rel'), rel.slice(0, 8));

}
function relRow(c, i) {
  return '<div class="rr"><input type="checkbox" data-i="' + i + '" aria-label="Khtar"><div class="rt" data-o="' + i + '"><b>' + esc(c.nom) + '</b><span>' + esc(c.tel || 'bla nmra') + ' · ' + c.n + ' cmd · ' +
    (c.statut === 'ghab' ? 'ghab ' + c.since + ' j' : 'akhir ' + fd(c.last)) + '</span></div><button class="sm" data-o="' + i + '">Offre ›</button></div>';
}
function bindRel(box, L) {
  var bulk = box.querySelector('#h-bulk') || box.querySelector('.bulkbtn');
  var upd = function () { var n = box.querySelectorAll('input[type=checkbox]:checked').length; if (bulk) { bulk.disabled = !n; bulk.textContent = '📲 Sifti l offres l (' + n + ') clients'; } };
  box.querySelectorAll('input[type=checkbox]').forEach(function (x) { x.onchange = upd; });
  box.querySelectorAll('[data-o]').forEach(function (x) { x.onclick = function () { offreModal(L[+x.dataset.o]); }; });
  if (bulk) bulk.onclick = function () { var sel = Array.prototype.map.call(box.querySelectorAll('input[type=checkbox]:checked'), function (x) { return L[+x.dataset.i]; }).filter(function (c) { return c.tel; }); bulkSend(sel); };
}
function payModal(mois, ba9i) {
  modal('<h2>💸 Khlass dyal commission</h2><p class="note">Mli Maddah ysifet lik chi flous mn commission dyal ' + esc(moisLabel(mois)) + ', sjjliha hna.</p>' +
    '<label>Montant (DH)<input id="p-m" type="number" min="1" inputmode="numeric" placeholder="' + (ba9i || '') + '"></label><label>Note (ikhtiyari)<input id="p-n" placeholder="ex: CIH"></label><div id="p-e"></div>' +
    '<button class="pri big" id="p-ok">Sjjel</button>');
  $('p-ok').onclick = function () { var b = this; b.disabled = true;
    call('addComPaiement', S.token, $('p-m').value, mois, $('p-n').value).then(function () { closeModal(); vHome(); })
      .catch(function (e) { b.disabled = false; $('p-e').innerHTML = errBox(e); }); };

/* ---------- OFFRE L CLIENT WA7D ---------- */
function offreModal(c) {
  var O = offresFor(c), st = { o: 0, s: 0 };
  var draw = function () {
    $('mbody').querySelector('#of-msg').textContent = msgFor(c, O[st.o].t, st.s);
  };
  modal('<h2>' + esc(c.nom) + '</h2><div class="note">' + esc(c.tel || '') + ' · ' + c.n + ' commandes · akhir: ' + esc(c.dernier || '') + ' (' + fd(c.last) + ')</div>' +
    '<div class="grp">1. Khtari l offre</div><div class="opts" id="of-o">' + O.map(function (o, i) { return '<div class="opt' + (i ? '' : ' on') + '" dir="rtl" data-i="' + i + '">' + esc(o.t) + '</div>'; }).join('') + '</div>' +
    '<div class="grp">2. Tari9a dyal l message</div>' + chipSel('of-s', [['0', 'Drif'], ['1', 'M9ni3'], ['2', 'Sri3']], '0') +
    '<div class="resume" dir="rtl" id="of-msg" contenteditable="true"></div><p class="note">T9dri tbdli f l message 9bel ma tsifti.</p>' +
    '<div class="act">' + (c.tel ? '<a class="wa" href="#" id="of-wa">📲 Sifti f WhatsApp</a><a href="tel:' + esc(c.tel) + '" id="of-call">Appel</a>' : '') + '<a href="#" id="of-done">✓ Dert relance</a></div>');
  $('of-o').querySelectorAll('.opt').forEach(function (x) { x.onclick = function () { $('of-o').querySelectorAll('.opt').forEach(function (y) { y.classList.toggle('on', y === x); }); st.o = +x.dataset.i; draw(); }; });
  bindSel('of-s', false, function (v) { st.s = +v; draw(); });
  draw();
  var mark = function (canal) { call('markRelance', S.token, c.cle, c.nom, c.tel, canal).then(function () { c.statut = 'tsift'; S.clientsP = null; }).catch(function () {}); };
  if ($('of-wa')) $('of-wa').onclick = function (e) { e.preventDefault(); window.open(waUrl(c.tel, $('of-msg').textContent), '_blank'); mark('wa'); };
  if ($('of-call')) $('of-call').onclick = function () { mark('call'); };
  $('of-done').onclick = function (e) { e.preventDefault(); mark('done'); closeModal(); if (S.view === 'home') vHome(); };
}

/* ---------- SIFT L BZAF DYAL CLIENTS DQA WA7DA ---------- */
function bulkSend(L) {
  if (!L.length) return;
  var Q = L.map(function (c) { return { c: c, O: offresFor(c), o: 0, done: false }; }), i = 0, style = 0;
  var draw = function () {
    var q = Q[i], c = q.c, sent = Q.filter(function (x) { return x.done; }).length;
    modal('<div class="wprog"><div style="width:' + Math.round(sent / Q.length * 100) + '%"></div></div><div class="note">' + sent + ' / ' + Q.length + ' tsiftat</div>' +
      '<h2>' + (i + 1) + '. ' + esc(c.nom) + '</h2><div class="note">' + esc(c.tel) + ' · ' + c.n + ' cmd</div>' +
      '<label>Offre<select id="b-o">' + q.O.map(function (o, k) { return '<option value="' + k + '"' + (k === q.o ? ' selected' : '') + '>' + esc(o.t.slice(0, 70)) + '</option>'; }).join('') + '</select></label>' +
      '<div class="resume" dir="rtl" id="b-msg" contenteditable="true">' + esc(msgFor(c, q.O[q.o].t, style)) + '</div>' +
      '<a class="wa" href="#" id="b-send">📲 Sifti l ' + esc(c.nom.split(/[\/(]/)[0]) + (q.done ? ' (tsiftat ✓)' : '') + '</a>' +
      '<div class="wnav"><button type="button" id="b-prev"' + (i ? '' : ' disabled') + '>‹</button><button type="button" id="b-skip">' + (i < Q.length - 1 ? 'Li jay ›' : 'Salit ✓') + '</button></div>' +
      '<p class="note">Kol client kayt7el lih WhatsApp b l message jahz: cliqui « Envoyer » f WhatsApp, w rj3i l l\'application, ghadi tl9ay li jay wajed.</p>');
    $('b-o').onchange = function () { q.o = +this.value; $('b-msg').textContent = msgFor(c, q.O[q.o].t, style); };
    $('b-send').onclick = function (e) {
      e.preventDefault(); window.open(waUrl(c.tel, $('b-msg').textContent), '_blank');
      q.done = true; call('markRelance', S.token, c.cle, c.nom, c.tel, 'wa').catch(function () {});
      S.clientsP = null;
      if (i < Q.length - 1) { i++; setTimeout(draw, 400); } else setTimeout(draw, 400);
    };
    $('b-prev').onclick = function () { if (i) { i--; draw(); } };
    $('b-skip').onclick = function () { if (i < Q.length - 1) { i++; draw(); } else { closeModal(); if (S.view === 'home') vHome(); else go(S.view); } };
  };
  draw();
}

/* ---------- OUTILS AI ---------- */
function vAI() {
  loadClients().catch(function () {});
  var tabs = [['script', '🎬 Script vidéo'], ['offres', '🎁 Offres'], ['affiche', '🖼️ Affiche ads'], ['vocal', '🎙️ Vocal dyal client']];
  S.aitab = S.aitab || 'script';
  show('<h1>Outils AI ✨</h1>' + chipSel('ai-t', tabs, S.aitab) + '<div class="panel" id="ai-f"></div><div id="ai-r"></div>');
  bindSel('ai-t', false, function (k) { S.aitab = k; aiForm(); });
  aiForm();
}
function aiForm() {
  var k = S.aitab, f = '<label>Client (ikhtiyari)<input id="ai-cl" list="ai-cls" placeholder="Smiya…"></label><datalist id="ai-cls">' +
    (S.clients || []).slice(0, 300).map(function (c) { return '<option value="' + esc(c.nom) + '">'; }).join('') + '</datalist>';
  if (k !== 'vocal') f += '<label>Chno kaybi3 / nachat dyalo<textarea id="ai-d" style="min-height:70px" placeholder="ex: mahal dyal l7wayj dyal drari f Témara, promo -20%…"></textarea></label>' +
    '<div class="form"><label>Mdina<input id="ai-v" placeholder="Témara"></label><label>Promo / offre<input id="ai-p" placeholder="ex: -20%, livraison fabor"></label></div>';
  if (k === 'script') f += '<label>Ch7al mn hook</label>' + chipSel('ai-h', [['1', '1 hook'], ['3', '3 hooks']], '1');
  if (k === 'affiche') f += '<label>Format</label>' + chipSel('ai-fm', [['carre', 'Carré (feed)'], ['story', 'Story']], 'carre') +
    '<div class="form"><label>Titre f l affiche<input id="ai-ti" placeholder="ex: -20% had simana"></label><label>Nmra / WhatsApp<input id="ai-te" inputmode="tel"></label></div>';
  if (k === 'vocal') f += '<label>Vocal dyal client (mn WhatsApp: partager → TIMEDIA, wla khtarih)<input type="file" accept="audio/*" id="ai-a"></label><label>Ma3lomat zayda (ikhtiyari)<input id="ai-d"></label>';
  f += '<button class="pri big" id="ai-go">✨ Khrej</button>';
  $('ai-f').innerHTML = f; $('ai-r').innerHTML = '';
  var st = { h: 1, fm: 'carre' };
  bindSel('ai-h', false, function (v) { st.h = +v; }); bindSel('ai-fm', false, function (v) { st.fm = v; });
  $('ai-go').onclick = function () {
    var b = this, nom = $('ai-cl').value.trim(), c = (S.clients || []).filter(function (x) { return x.nom === nom; })[0];
    var p = { client: nom, description: $('ai-d') ? $('ai-d').value : '', ville: $('ai-v') ? $('ai-v').value : '', promo: $('ai-p') ? $('ai-p').value : '',
      dernier: c ? c.dernier + ' (' + c.n + ' commandes, moyenne ' + c.moy + ' DH)' : '', hooks: st.h, format: st.fm };
    var go2 = function () {
      b.disabled = true; b.textContent = 'Kaykhdem… (10-30 sec)';
      call('aiGenerate', S.token, k, p).then(function (r) { b.disabled = false; b.textContent = '✨ 3awd khrej'; aiResult(k, r, p, c); })
        .catch(function (e) { b.disabled = false; b.textContent = '✨ Khrej'; $('ai-r').innerHTML = errBox(e); });
    };
    if (k === 'vocal') { var file = $('ai-a').files[0]; if (!file) { $('ai-r').innerHTML = errBox('Khtari l vocal.'); return; }
      if (file.size > 15e6) { $('ai-r').innerHTML = errBox('Vocal kbir bzaf.'); return; }
      var fr = new FileReader(); fr.onload = function () { p.audio = fr.result; go2(); }; fr.readAsDataURL(file); return; }
    if (!p.description.trim()) { $('ai-r').innerHTML = errBox('Ktbi chno kaybi3 l client.'); return; }
    go2();
  };
}
function aiResult(k, r, p, c) {
  if (k === 'affiche') {
    var tel = $('ai-te').value, ti = $('ai-ti').value;
    composeAffiche(r.image, ti || p.promo, tel, p.format).then(function (url) {
      $('ai-r').innerHTML = '<div class="panel"><img src="' + url + '" alt="Affiche" style="width:100%;border-radius:10px">' +
        '<a class="wa" href="' + url + '" download="affiche-timedia.jpg">⬇️ Telechargi l affiche</a></div>';
    });
    return;
  }
  var tel = c && c.tel;
  $('ai-r').innerHTML = '<div class="panel"><div class="resume" dir="rtl" id="ai-txt" contenteditable="true">' + esc(r.text) + '</div>' +
    '<div class="act"><a href="#" id="ai-cp">📋 Copier</a>' + (tel ? '<a class="wa" href="#" id="ai-wa">📲 Sifti l ' + esc(c.nom) + '</a>' : '') + '</div></div>';
  $('ai-cp').onclick = function (e) { e.preventDefault(); var t = $('ai-txt').textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { $('ai-cp').textContent = '✓ Tcopiya'; }).catch(function () { alert('Selectionni l texte w copiyih'); }); };
  if ($('ai-wa')) $('ai-wa').onclick = function (e) { e.preventDefault(); window.open(waUrl(tel, $('ai-txt').textContent), '_blank'); };
}
function composeAffiche(src, titre, tel, format) {
  return new Promise(function (res) {
    var img = new Image();
    img.onload = function () {
      var W = 1080, H = format === 'story' ? 1920 : 1080, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      var x = cv.getContext('2d'), k = Math.max(W / img.width, H / img.height);
      x.drawImage(img, (W - img.width * k) / 2, (H - img.height * k) / 2, img.width * k, img.height * k);
      var g = x.createLinearGradient(0, 0, 0, H * 0.3); g.addColorStop(0, 'rgba(0,0,0,.65)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H * 0.3);
      x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = '800 ' + (titre && titre.length > 18 ? 64 : 84) + 'px Archivo, Arial, sans-serif';
      if (titre) x.fillText(titre, W / 2, H * 0.12, W - 80);
      if (tel) { x.fillStyle = '#1FAF54'; var bw = 640, bh = 110; x.beginPath(); if (x.roundRect) x.roundRect((W - bw) / 2, H - bh - 70, bw, bh, 55); else x.rect((W - bw) / 2, H - bh - 70, bw, bh); x.fill();
        x.fillStyle = '#fff'; x.font = '700 54px Archivo, Arial, sans-serif'; x.fillText('WhatsApp ' + tel, W / 2, H - 70 - 38, bw - 40); }
      res(cv.toDataURL('image/jpeg', 0.9));
    };
    img.src = src;
  });
}
